name: hermes-tweet
version: 0.1.12
description: "Hermes Agent plugin for Twitter search, tweet monitoring, follower exports, and approved X actions through Xquik. Not affiliated with X Corp."
author: Xquik
requires_env:
  - name: XQUIK_API_KEY
    description: "Xquik API key. Create one in the Xquik dashboard."
    url: "https://dashboard.xquik.com"
    secret: true
optional_env:
  - XQUIK_BASE_URL
  - HERMES_TWEET_ENABLE_ACTIONS
provides_tools:
  - tweet_explore
  - tweet_read
  - tweet_action
